[package]
name = "axum-hotreload"
version = "0.1.0"
edition = "2021"
description = "Hot-reload for axum: live-swap your handlers via cdylib reload while preserving state and in-flight requests."
license = "MIT"
readme = "README.md"
repository = "https://github.com/dennj/axum-hotreload"
keywords = ["axum", "hot-reload", "dev", "watch", "livereload"]
categories = ["development-tools", "web-programming"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-livereload = "0.10"
arc-swap = "1"
libloading = "0.8"
notify = "6"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
thiserror = "1"
